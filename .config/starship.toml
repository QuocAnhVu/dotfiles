############################
# Starship prompt
# Adds today's Git added/removed lines next to the branch
############################

# Keep a mostly-default order but inject our custom module
# immediately after the git_branch.
format = "$username$hostname$localip$shlvl$singularity$kubernetes$directory$vcsh$git_branch$git_metrics$git_commit$git_state$git_status$hg_branch$docker_context$package$buf$cmake$cobol$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$gleam$golang$guix_shell$haskell$haxe$helm$julia$kotlin$lua$nim$nodejs$ocaml$opa$perl$php$pony$pulumi$purescript$python$quarto$raku$red$ruby$rust$scala$solidity$swift$terraform$vlang$vagrant$zig$nix_shell$conda$meson$spack$memory_usage$aws$gcloud$openstack$azure$env_var$crystal$direnv$os$container$cmd_duration$line_break$jobs$battery$time$status$shell$character"

[git_branch]
# Default-ish formatting for the branch name
symbol = " "

# Built-in working-tree metrics: added/removed lines
[git_metrics]
format = " [+$added]($added_style)[-$deleted]($deleted_style)"
added_style = "green"
deleted_style = "red"
only_nonzero_diffs = true

