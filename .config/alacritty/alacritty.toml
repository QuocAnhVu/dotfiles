[general]
# Theme: switch with ./theme.sh in the dotfiles repo (or swap the import by hand)
# import = ["themes/nord.toml"]
# import = ["themes/gruvbox_dark.toml"]
import = ["themes/everforest_dark.toml"]

[window]
decorations = "None"
opacity = 0.9375
resize_increments = true

[window.padding]
x = 4
y = 2

[font]
size = 8

[font.normal]
family = "JetBrainsMono Nerd Font"

# Start zellij directly: environment variables come from the desktop session
# (~/.config/environment.d), so no shell needs to set them up first. zellij's
# default_shell (nu) is set in zellij/config.kdl.
[terminal.shell]
program = "zellij"

[colors]
transparent_background_colors = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
