[general]
import = ["themes/nord.toml"]

[window]
decorations = "None"
opacity = 0.9375
resize_increments = true

[window.padding]
x = 4
y = 2

[font]
size = 8

[font.normal]
family = "JetBrainsMono Nerd Font"

# zellij's default_shell (nu) is set in zellij/config.kdl
[terminal.shell]
program = "/usr/bin/zsh"
args = ["-i", "-c", "zellij"]

[colors]
transparent_background_colors = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
