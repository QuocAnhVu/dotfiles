[general]
# Theme: themes/current.toml, which ./theme.sh in the dotfiles repo writes for
# this machine (not in git). Without it, everforest.
import = ["themes/everforest_dark.toml", "themes/current.toml"]

[window]
decorations = "None"
opacity = 0.9375
resize_increments = true

[window.padding]
x = 4
y = 2

[font]
size = 8

[font.normal]
family = "JetBrainsMono Nerd Font"

# Start zellij directly: environment variables come from the desktop session
# (~/.config/environment.d), so no shell needs to set them up first. zellij's
# default_shell (nu) is set in zellij/config.kdl.
[terminal.shell]
program = "zellij"

[colors]
transparent_background_colors = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
